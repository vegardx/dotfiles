---
- name: Ensure ~/.zsh directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.zsh"
    state: directory
    mode: "0755"

- name: Ensure ~/.config subdirectories exist
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - .config/git
    - .config/ghostty/themes
    - .config/mise
    - .config/gh

- name: Ensure ~/.gnupg directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.gnupg"
    state: directory
    mode: "0700"

- name: Ensure ~/.ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.ssh"
    state: directory
    mode: "0700"

- name: Ensure ~/.pi/agent directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.pi/agent"
    state: directory
    mode: "0755"

- name: Symlink home directory dotfiles
  ansible.builtin.file:
    src: "{{ role_path }}/files/{{ item.src }}"
    dest: "{{ ansible_facts.env.HOME }}/{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: zshrc, dest: .zshrc }
    - { src: zshenv, dest: .zshenv }
    - { src: zprofile, dest: .zprofile }
    - { src: gitconfig, dest: .gitconfig }

- name: Symlink zsh modules
  ansible.builtin.file:
    src: "{{ role_path }}/files/zsh/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.zsh/{{ item }}"
    state: link
    force: true
  loop:
    - shell.zsh
    - prompt.zsh
    - plugins.zsh

- name: Symlink config files
  ansible.builtin.file:
    src: "{{ role_path }}/files/config/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.config/{{ item }}"
    state: link
    force: true
  loop:
    - git/ignore
    - ghostty/config
    - ghostty/themes/catppuccin-macchiato.conf
    - mise/config.toml
    - gh/config.yml

- name: Symlink gnupg configs
  ansible.builtin.file:
    src: "{{ role_path }}/files/gnupg/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.gnupg/{{ item }}"
    state: link
    force: true
  loop:
    - gpg.conf
    - gpg-agent.conf

- name: Symlink pi agent configs
  ansible.builtin.file:
    src: "{{ role_path }}/files/pi/agent/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.pi/agent/{{ item }}"
    state: link
    force: true
  loop:
    - settings.json
    - AGENTS.md
    - keybindings.json

- name: Symlink SSH config
  ansible.builtin.file:
    src: "{{ role_path }}/files/ssh/config"
    dest: "{{ ansible_facts.env.HOME }}/.ssh/config"
    state: link
    force: true
