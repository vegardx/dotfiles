---
# NOTE: If you move a config file to a new location, add the OLD path here
# temporarily to clean up stale symlinks on machines that already ran the playbook.
# Remove entries once all machines have been updated.
#
# - name: Remove stale symlinks from previous locations
#   ansible.builtin.file:
#     path: "{{ ansible_facts.env.HOME }}/{{ item }}"
#     state: absent
#   loop:
#     - .old/path/here

# ── XDG directories ──────────────────────────────────────────────────
- name: Ensure XDG config subdirectories exist
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - .config/git
    - .config/gnupg
    - .config/zsh
    - .config/ghostty/themes
    - .config/mise
    - .config/npm
    - .config/gh
    - .config/ssl
    - .config/zed

- name: Ensure XDG data directories exist
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - .local/share/zsh

- name: Ensure ~/.config/gnupg has restricted permissions
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/gnupg"
    state: directory
    mode: "0700"

- name: Ensure ~/.ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.ssh"
    state: directory
    mode: "0700"

- name: Ensure ~/.docker directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.docker"
    state: directory
    mode: "0755"

- name: Ensure ~/.config/pi/agent directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/pi/agent"
    state: directory
    mode: "0755"

# ── Bootstrap zshenv (only file that stays in ~) ─────────────────────
- name: Symlink bootstrap ~/.zshenv
  ansible.builtin.file:
    src: "{{ role_path }}/files/zshenv-bootstrap"
    dest: "{{ ansible_facts.env.HOME }}/.zshenv"
    state: link
    force: true

# ── Zsh config (ZDOTDIR = ~/.config/zsh) ─────────────────────────────
- name: Symlink zsh dotfiles
  ansible.builtin.file:
    src: "{{ role_path }}/files/config/zsh/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.config/zsh/{{ item }}"
    state: link
    force: true
  loop:
    - .zshenv
    - .zshrc
    - .zprofile
    - shell.zsh
    - prompt.zsh
    - plugins.zsh

# ── Git config (native XDG path) ─────────────────────────────────────
- name: Symlink git config
  ansible.builtin.file:
    src: "{{ role_path }}/files/config/git/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.config/git/{{ item }}"
    state: link
    force: true
  loop:
    - config
    - config-github
    - config-dnb
    - ignore

# ── GnuPG (GNUPGHOME = ~/.config/gnupg) ──────────────────────────────
- name: Symlink gnupg configs
  ansible.builtin.file:
    src: "{{ role_path }}/files/config/gnupg/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.config/gnupg/{{ item }}"
    state: link
    force: true
  loop:
    - gpg.conf
    - gpg-agent.conf

# ── Other ~/.config apps ─────────────────────────────────────────────
- name: Symlink config files
  ansible.builtin.file:
    src: "{{ role_path }}/files/config/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.config/{{ item }}"
    state: link
    force: true
  loop:
    - ghostty/config
    - ghostty/themes/catppuccin-macchiato.conf
    - mise/config.toml
    - npm/npmrc
    - gh/config.yml
    - ssl/zscaler.pem
    - zed/settings.json

# ── Pi agent ─────────────────────────────────────────────────────────
- name: Symlink pi agent configs
  ansible.builtin.file:
    src: "{{ role_path }}/files/pi/agent/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.config/pi/agent/{{ item }}"
    state: link
    force: true
  loop:
    - AGENTS.md
    - keybindings.json

# ── SSH ──────────────────────────────────────────────────────────────
- name: Symlink SSH config
  ansible.builtin.file:
    src: "{{ role_path }}/files/ssh/config"
    dest: "{{ ansible_facts.env.HOME }}/.ssh/config"
    state: link
    force: true

- name: Symlink Docker config
  ansible.builtin.file:
    src: "{{ role_path }}/files/docker/config.json"
    dest: "{{ ansible_facts.env.HOME }}/.docker/config.json"
    state: link
    force: true

# ── AGENTS.md (pi context hierarchy) ─────────────────────────────────
- name: Ensure ~/src directories exist for AGENTS.md symlinks
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/src/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - github.com/vegardx
    - github.com/netwerk-io
    - dnb.ghe.com

- name: Symlink AGENTS.md files
  ansible.builtin.file:
    src: "{{ role_path }}/files/src/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/src/{{ item }}"
    state: link
    force: true
  loop:
    - AGENTS.md
    - github.com/AGENTS.md
    - github.com/vegardx/AGENTS.md
    - github.com/netwerk-io/AGENTS.md
    - dnb.ghe.com/AGENTS.md
