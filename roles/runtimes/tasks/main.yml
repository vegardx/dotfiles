---
# ── Directory structure ───────────────────────────────────────────────
- name: Create directory structure
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - src/github.com/vegardx
    - src/github.com/netwerk-io
    - src/dnb.ghe.com
    - tmp

# ── mise global tools ─────────────────────────────────────────────────
- name: Install mise global tools
  ansible.builtin.shell: |
    eval "$(/opt/homebrew/bin/mise activate bash)"
    mise install
  register: mise_install
  changed_when: "'all tools are installed' not in mise_install.stderr"

# ── Docker CLI plugins ────────────────────────────────────────────────
- name: Ensure ~/.docker/cli-plugins directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.docker/cli-plugins"
    state: directory
    mode: "0755"

- name: Symlink docker-compose plugin
  ansible.builtin.file:
    src: "/opt/homebrew/opt/docker-compose/bin/docker-compose"
    dest: "{{ ansible_facts.env.HOME }}/.docker/cli-plugins/docker-compose"
    state: link
    force: true

- name: Symlink docker-buildx plugin
  ansible.builtin.file:
    src: "/opt/homebrew/opt/docker-buildx/bin/docker-buildx"
    dest: "{{ ansible_facts.env.HOME }}/.docker/cli-plugins/docker-buildx"
    state: link
    force: true


- name: Start colima on login
  ansible.builtin.command: brew services start colima
  args:
    creates: "{{ ansible_facts.env.HOME }}/Library/LaunchAgents/homebrew.mxcl.colima.plist"

- name: Start ollama on login
  ansible.builtin.command: brew services start ollama
  args:
    creates: "{{ ansible_facts.env.HOME }}/Library/LaunchAgents/homebrew.mxcl.ollama.plist"

# ── Global npm packages ───────────────────────────────────────────────
- name: Install global npm packages
  ansible.builtin.shell: |
    eval "$(/opt/homebrew/bin/mise activate bash)"
    npm install -g {{ item }}
  args:
    creates: "{{ ansible_facts.env.HOME }}/.local/share/mise/installs/node/24/lib/node_modules/{{ item }}"
  loop:
    - "@earendil-works/pi-coding-agent"
    - "@anthropic-ai/claude-code"
    - "@openai/codex"
    - "@github/copilot"
    - codeburn

# ── gh extensions ─────────────────────────────────────────────────────
# gh-sub-issue was unused: /park links sub-issues via GitHub's native
# sub_issues REST API directly. Remove it from machines that still have it.
- name: Remove deprecated gh-sub-issue extension
  ansible.builtin.command: gh extension remove sub-issue
  args:
    removes: "{{ ansible_facts.env.HOME }}/.local/share/gh/extensions/gh-sub-issue"

# ── Post-setup reminders ─────────────────────────────────────────────
- name: Add runtimes post-setup reminders
  ansible.builtin.set_fact:
    setup_reminders: >-
      {{
        setup_reminders | default([]) +
        runtimes_post_setup_reminders
      }}
  vars:
    runtimes_post_setup_reminders:
      - >-
        Add exa API key to macOS Keychain: security add-generic-password
        -a $LOGNAME -s exa-api-key -w "<value>"
      - >-
        Add context7 API key to macOS Keychain (optional): security
        add-generic-password -a $LOGNAME -s context7-api-key -w "<value>"
      - "Authenticate gh: gh auth login"
  changed_when: false
