---
# ── Directory structure ───────────────────────────────────────────────
- name: Create directory structure
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - src/github.com/vegardx
    - src/github.com/netwerk-io
    - src/dnb.ghe.com
    - tmp

# ── mise global tools ─────────────────────────────────────────────────
- name: Install mise global tools
  ansible.builtin.shell: |
    eval "$(/opt/homebrew/bin/mise activate bash)"
    mise use --global node@22 go@1.26 terraform@1.9.8 uv@latest tflint@latest
  args:
    creates: "{{ ansible_facts.env.HOME }}/.local/share/mise/installs/node"

# ── Docker CLI plugins ────────────────────────────────────────────────
- name: Ensure ~/.docker/cli-plugins directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.docker/cli-plugins"
    state: directory
    mode: "0755"

- name: Symlink docker-compose plugin
  ansible.builtin.file:
    src: "/opt/homebrew/opt/docker-compose/bin/docker-compose"
    dest: "{{ ansible_facts.env.HOME }}/.docker/cli-plugins/docker-compose"
    state: link
    force: true

- name: Symlink docker-buildx plugin
  ansible.builtin.file:
    src: "/opt/homebrew/opt/docker-buildx/bin/docker-buildx"
    dest: "{{ ansible_facts.env.HOME }}/.docker/cli-plugins/docker-buildx"
    state: link
    force: true


- name: Start colima on login
  ansible.builtin.command: brew services start colima
  args:
    creates: "{{ ansible_facts.env.HOME }}/Library/LaunchAgents/homebrew.mxcl.colima.plist"

- name: Start ollama on login
  ansible.builtin.command: brew services start ollama
  args:
    creates: "{{ ansible_facts.env.HOME }}/Library/LaunchAgents/homebrew.mxcl.ollama.plist"

# ── Global npm packages ───────────────────────────────────────────────
- name: Install global npm packages
  ansible.builtin.shell: |
    eval "$(/opt/homebrew/bin/mise activate bash)"
    npm install -g {{ item }}
  args:
    creates: "{{ ansible_facts.env.HOME }}/.local/share/mise/installs/node/22/lib/node_modules/{{ item.split('/')[-1] }}"
  loop:
    - "@earendil-works/pi-coding-agent"
    - "@anthropic-ai/claude-code"
    - "@openai/codex"
    - codeburn

# ── gh extensions ─────────────────────────────────────────────────────
- name: Install gh extensions
  ansible.builtin.shell: gh extension install {{ item }}
  args:
    creates: "{{ ansible_facts.env.HOME }}/.local/share/gh/extensions/{{ item.split('/')[-1] }}"
  loop:
    - agbiotech/gh-sub-issue

# ── Post-setup message ────────────────────────────────────────────────
- name: Display post-setup reminders
  ansible.builtin.debug:
    msg: |
      ┌──────────────────────────────────────────────────────────┐
      │ Manual steps remaining:                                  │
      │                                                          │
      │ 1. Add secrets to macOS Keychain:                        │
      │    security add-generic-password -a $LOGNAME \           │
      │      -s exa-api-key -w "<value>"                         │
      │    security add-generic-password -a $LOGNAME \           │
      │      -s context7-api-key -w "<value>"  (optional)        │
      │                                                          │
      │ 2. Set up GPG with YubiKey:                              │
      │    gpg --card-status                                      │
      │                                                          │
      │ 3. Authenticate gh:                                      │
      │    gh auth login                                         │
      │                                                          │
      │ 4. Log out and back in for login items to take effect    │
      └──────────────────────────────────────────────────────────┘
