---
homebrew_formulae:
  # Core CLI
  - coreutils
  - fd
  - fzf
  - ripgrep
  - wget
  - shfmt

  # Shell
  - zsh
  - zsh-autosuggestions

  # Dev
  - gh
  - git-lfs
  - git-filter-repo
  - pre-commit
  - actionlint
  - mise

  # Languages
  - ruff

  # Go
  - golangci-lint

  # Containers
  - colima
  - docker
  - docker-compose
  - docker-buildx
  - docker-credential-helper

  # Infra
  - awscli
  - azure-cli
  - granted
  - terraform-docs

  # Security
  - pass
  - pass-otp
  - pinentry-mac
  - zizmor
  - act

  # Local LLM
  - ollama

# Formulae to remove from machines that previously had them installed.
# Kept here (rather than just deleted from the list above) so existing
# machines uninstall them on the next run.
homebrew_formulae_absent:
  - wallpaper

homebrew_casks:
  # Browsers
  - google-chrome
  - zen

  # Dev
  - ghostty
  - zed
  - visual-studio-code
  - visual-studio-code@insiders
  - claude
  - codex-app
  - github-copilot-app

  # Productivity
  - rectangle
  - contexts
  - slack
  - discord

  # Utils
  - betterdisplay
  - sanesidebuttons
  - hiddenbar
  - stats

# Casks to remove from machines that previously had them installed.
# The codex CLI is provided via npm (@openai/codex) for consistency with
# claude/pi; only the GUI app (codex-app) comes from Homebrew.
homebrew_casks_absent:
  - codex
