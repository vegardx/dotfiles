---
# ── Appearance ────────────────────────────────────────────────────────
- name: "Appearance: dark mode"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleInterfaceStyle
    type: string
    value: Dark
  when: macos_dark_mode
  notify: restart dock

- name: "Appearance: solid black wallpaper"
  ansible.builtin.command: >
    osascript -e 'tell application "System Events" to tell every desktop
    to set picture to "/System/Library/Desktop Pictures/Solid Colors/Black.png"'
  changed_when: true

# ── Dock ──────────────────────────────────────────────────────────────
- name: "Dock: autohide"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: autohide
    type: bool
    value: "{{ macos_dock_autohide }}"
  notify: restart dock

- name: "Dock: tile size"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: tilesize
    type: float
    value: "{{ macos_dock_tilesize }}"
  notify: restart dock

- name: "Dock: show recents"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: show-recents
    type: bool
    value: "{{ macos_dock_show_recents }}"
  notify: restart dock

- name: "Dock: minimize to application"
  community.general.osx_defaults:
    domain: com.apple.dock
    key: minimize-to-application
    type: bool
    value: "{{ macos_dock_minimize_to_application }}"
  notify: restart dock

# ── Keyboard ──────────────────────────────────────────────────────────
- name: "Keyboard: key repeat rate"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: KeyRepeat
    type: float
    value: "{{ macos_key_repeat }}"

- name: "Keyboard: initial key repeat delay"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: InitialKeyRepeat
    type: float
    value: "{{ macos_initial_key_repeat }}"

# ── Finder ────────────────────────────────────────────────────────────
- name: "Finder: show all file extensions"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: "{{ macos_finder_show_all_extensions }}"
  notify: restart finder

- name: "Finder: default view style (column)"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: FXPreferredViewStyle
    type: string
    value: "{{ macos_finder_view_style }}"
  notify: restart finder

- name: "Finder: search current folder by default"
  community.general.osx_defaults:
    domain: com.apple.finder
    key: FXDefaultSearchScope
    type: string
    value: "{{ macos_finder_search_scope }}"
  notify: restart finder

# ── Trackpad ──────────────────────────────────────────────────────────
- name: "Trackpad: tap to click"
  community.general.osx_defaults:
    domain: com.apple.AppleMultitouchTrackpad
    key: Clicking
    type: bool
    value: "{{ macos_trackpad_tap_to_click }}"

- name: "Trackpad: disable natural scrolling"
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: com.apple.swipescrolldirection
    type: bool
    value: "{{ macos_natural_scrolling }}"

# ── Window Manager ────────────────────────────────────────────────────
- name: "Window Manager: disable Stage Manager"
  community.general.osx_defaults:
    domain: com.apple.WindowManager
    key: GloballyEnabled
    type: bool
    value: "{{ macos_stage_manager }}"
  notify: restart dock

# ── Screenshots ───────────────────────────────────────────────────────
- name: "Screenshots: capture style"
  community.general.osx_defaults:
    domain: com.apple.screencapture
    key: style
    type: string
    value: "{{ macos_screenshot_style }}"

- name: "Screenshots: enable video"
  community.general.osx_defaults:
    domain: com.apple.screencapture
    key: video
    type: bool
    value: "{{ macos_screenshot_video }}"

# ── Spotlight ──────────────────────────────────────────────────────────
- name: "Spotlight: only show Applications and System Preferences"
  ansible.builtin.shell: |
    defaults write com.apple.Spotlight orderedItems -array \
      '{enabled = 1; name = APPLICATIONS;}' \
      '{enabled = 0; name = "MENU_EXPRESSION";}' \
      '{enabled = 0; name = CONTACT;}' \
      '{enabled = 0; name = "MENU_CONVERSION";}' \
      '{enabled = 0; name = "MENU_DEFINITION";}' \
      '{enabled = 0; name = SOURCE;}' \
      '{enabled = 0; name = DOCUMENTS;}' \
      '{enabled = 0; name = "EVENT_TODO";}' \
      '{enabled = 0; name = DIRECTORIES;}' \
      '{enabled = 0; name = FONTS;}' \
      '{enabled = 0; name = IMAGES;}' \
      '{enabled = 0; name = MESSAGES;}' \
      '{enabled = 0; name = MOVIES;}' \
      '{enabled = 0; name = MUSIC;}' \
      '{enabled = 0; name = "MENU_OTHER";}' \
      '{enabled = 0; name = PDF;}' \
      '{enabled = 0; name = PRESENTATIONS;}' \
      '{enabled = 0; name = "MENU_SPOTLIGHT_SUGGESTIONS";}' \
      '{enabled = 0; name = SPREADSHEETS;}' \
      '{enabled = 1; name = "SYSTEM_PREFS";}' \
      '{enabled = 0; name = TIPS;}' \
      '{enabled = 0; name = BOOKMARKS;}'
  changed_when: true

- name: "Spotlight: exclude developer directories from indexing"
  ansible.builtin.shell: |
    for dir in ~/src ~/node_modules ~/.npm ~/.cache ~/go ~/.local/share/mise; do
      if [ -d "$dir" ]; then
        mdutil -i off "$dir" 2>/dev/null || true
      fi
    done
  changed_when: false

# ── Dock arrangement (dockutil) ───────────────────────────────────────
- name: Check if dockutil is installed
  ansible.builtin.command: which dockutil
  register: dockutil_check
  changed_when: false
  failed_when: false

- name: Install dockutil
  community.general.homebrew:
    name: dockutil
    state: present
  when: dockutil_check.rc != 0

- name: Remove all dock items
  ansible.builtin.command: dockutil --remove all --no-restart
  changed_when: true
  when: macos_dock_apps | length > 0

- name: Add dock apps
  ansible.builtin.command: "dockutil --add '{{ item }}' --no-restart"
  loop: "{{ macos_dock_apps }}"
  changed_when: true
  notify: restart dock

# ── Login items ───────────────────────────────────────────────────────
- name: Add login items
  ansible.builtin.command: >
    osascript -e 'tell application "System Events" to make login item at end
    with properties {name:"{{ item }}", path:"/Applications/{{ item }}.app", hidden:true}'
  loop: "{{ macos_login_items }}"
  register: login_item_result
  changed_when: login_item_result.rc == 0
  failed_when: false

# ── App preferences ───────────────────────────────────────────────────
- name: Import Stats preferences
  ansible.builtin.command: defaults import eu.exelban.Stats {{ role_path }}/../dotfiles/files/config/stats/eu.exelban.Stats.plist
  changed_when: true
